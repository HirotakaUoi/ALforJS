<h1>QuickSort2</h1>
<p class="note">
「実行」を押す（またはEnter）と開始。<code>input()</code>で止まったらターミナル内に入力欄が現れるので、
値を打ってEnterで続きが実行されます。</p>

<div class="panes">
  <section class="code-pane">
    <h2>ソースコード</h2>
    <p class="note" style="margin-bottom: 10px;">
      <code>print()</code> / <code>input()</code> は環境が提供する入出力（C++の cout / cin に相当）です。
      編集して「実行」を押すと、その内容で動きます。<br>
      このプログラムは入力があるので <code>function* main()</code> ＋ <code>yield* input(msg)</code> の形になっています
      （途中で止まって入力を待つため）。
    </p>
    <textarea id="source" spellcheck="false"></textarea>
  </section>
  <section class="terminal-pane">
    <h2>実行</h2>
    <div id="terminal" tabindex="0"></div>
    <div class="controls">
      <button id="runBtn">実行</button>
      <button id="resetBtn" class="secondary" disabled>リセット</button>
    </div>
  </section>
</div>

<script id="source-text" type="text/plain">
function qsort(s, first, last) {
    let pivot, i, j, temp, piv, mid;

    for (let k = first; k <= last; k++) {
        print(s[k] + " ");
    }
    print("first= " + first + " last= " + last + "\n");

    if (first < last) {
        if ((last - first) > 2) {
            mid = Math.floor((first + last) / 2);
            if (s[first] > s[last]) {
                if (s[last] > s[mid]) {
                    piv = last;
                } else if (s[first] > s[mid]) {
                    piv = mid;
                } else {
                    piv = first;
                }
            } else if (s[mid] < s[first]) {
                piv = first;
            } else if (s[last] > s[mid]) {
                piv = mid;
            } else {
                piv = last;
            }
            temp = s[piv];
            s[piv] = s[last];
            s[last] = temp;
        }
        pivot = s[last];
        //          print("Pivot=" + pivot + "\n");
        i = first;
        j = last - 1;
        while (true) {
            while ((i < last) && (s[i] < pivot)) {
                i += 1;
            }
            while ((j >= first) && (s[j] > pivot)) {
                j -= 1;
            }
            //          print("i= " + i + "j= " + j + "\n");
            if (i >= j) {
                break;
            }
            temp = s[i];
            s[i] = s[j];
            s[j] = temp;
            i += 1;
            j -= 1;
        }
        temp = s[i];
        s[i] = s[last];
        s[last] = temp;

        for (let k = first; k < i; k++) {
            print(s[k] + " ");
        }
        print(" Pivot=" + s[i] + " ");
        for (let k = i + 1; k <= last; k++) {
            print(s[k] + " ");
        }
        print("\n");

        qsort(s, first, i - 1);
        qsort(s, i + 1, last);
    }
}

function quickSort(s, N) { qsort(s, 0, N - 1); }

function* main() {
// const s = [4, 5, 2, 8, 6, 10, 11, 9, 3, 0, -1, -2, 1];
// const s = [4, 5, 2, 8, 7, 10, 8, 1, -10, -4, 9, 3, 0, 12, 0, 2,
// 100,-100,2];
// const N = 13;
    const arraySize = parseInt(yield* input("Input array size: "), 10);
    const s = [];   // JSの配列は自動拡張されるため大きさの指定は不要
    const N = arraySize;
    for (let i = 0; i < N; i++) {
        // s[i] = (rand() % 10000000);
        s[i] = N - i;
    }

    for (let k = 0; k < N; k++) {
        print(s[k] + " ");
    }
    print("\n");

    quickSort(s, N);
    for (let k = 0; k < N; k++) {
        print(s[k] + " ");
    }
    print("\n");
}
</script>
