<h1>BogoSort1</h1>
<p class="note">※ 運まかせのソートです。要素数が多いと終わらないことがあります。<br>
「実行」を押す（またはEnter）と開始。<code>input()</code>で止まったらターミナル内に入力欄が現れるので、
値を打ってEnterで続きが実行されます。</p>

<div class="panes">
  <section class="code-pane">
    <h2>ソースコード</h2>
    <p class="note" style="margin-bottom: 10px;">
      <code>print()</code> / <code>input()</code> は環境が提供する入出力（C++の cout / cin に相当）です。
      編集して「実行」を押すと、その内容で動きます。
    </p>
    <textarea id="source" spellcheck="false"></textarea>
  </section>
  <section class="terminal-pane">
    <h2>実行</h2>
    <div id="terminal" tabindex="0"></div>
    <div class="controls">
      <button id="runBtn">実行</button>
      <button id="resetBtn" class="secondary" disabled>リセット</button>
    </div>
  </section>
</div>

<script id="source-text" type="text/plain">
function rand() { return Math.floor(Math.random() * 2147483648); }

function shuffle(s, N) {
    let k, temp;

    for (let i = N - 1; i > 0; --i) {
        k = rand() % (i + 1);
        temp = s[i];
        s[i] = s[k];
        s[k] = temp;
    }
}

function bogoSort(s, N) {
    let count = 1;
    let swapped;

    while (true) {
        for (let k = 0; k < N; k++) {
            print(s[k] + " ");
        }
        print("Count=" + count++ + "\n");
        swapped = false;
        for (let i = 0; i < N - 1; i++) {
            if (s[i] > s[i + 1]) {
                swapped = true;
                break;
            }
        }
        if (!swapped) break;
        shuffle(s, N);
    }
}

function main() {
    const s = [4, 5, 2];
    const N = 3;
// const s = [4, 5, 2, 9, 3];
// const N = 5;
// const s = [4, 5, 2, 7, 1, 9, 3];
// const N = 7;
// const s = [4, 5, 2, 8, 7, 1, 9, 3, 0];
// const N = 9;
// const s = [4, 5, 8, 2, 7, 1, 9, 0, 3, 10];
// const N = 13;

    bogoSort(s, N);
    for (let k = 0; k < N; k++) {
        print(s[k] + " ");
    }
    print("\n");
}

</script>
