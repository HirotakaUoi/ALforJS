<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SleepSort1 プレイグラウンド</title>
<link rel="stylesheet" href="common/playground.css">
</head>
<body>

<p class="note"><a href="index.html">&larr; 一覧に戻る</a></p>
<h1>SleepSort1</h1>
<p class="note">※ 値×1秒待って出力するため、完走まで約30秒かかります。<br>
「実行」を押す（またはEnter）と開始。<code>input()</code>で止まったらターミナル内に入力欄が現れるので、
値を打ってEnterで続きが実行されます。</p>

<div class="panes">
  <section class="code-pane">
    <h2>ソースコード</h2>
    <p class="note" style="margin-bottom: 10px;">
      <code>print()</code> / <code>input()</code> は環境が提供する入出力（C++の cout / cin に相当）です。
      編集して「実行」を押すと、その内容で動きます。
    </p>
    <textarea id="source" spellcheck="false"></textarea>
  </section>
  <section class="terminal-pane">
    <h2>実行</h2>
    <div id="terminal" tabindex="0"></div>
    <div class="controls">
      <button id="runBtn">実行</button>
      <button id="resetBtn" class="secondary" disabled>リセット</button>
    </div>
  </section>
</div>

<script id="source-text" type="text/plain">
function sleepkSort(s, N) {
    for (let i = 0; i < N; ++i) {
        // setTimeoutでスレッドの代わりにタイマーを作成
        // （Node.jsはすべてのタイマーが終わるまでプロセスを終了しないので、
        //   C++のようなjoin（スレッドの終了待ち）は不要）
        setTimeout(() => {
            print(s[i] + "\n");
        }, s[i] * 1000);
    }
}

function main() {
    const s = [30, 9, 5, 15, 8, 6, 1];
    const N = 7;

    for (let k = 0; k < N; k++) {
        print(s[k] + " ");
    }
    print("\n");

    sleepkSort(s, N);
}



// node SleepSort1.js
</script>
<script src="common/runner.js"></script>

</body>
</html>
