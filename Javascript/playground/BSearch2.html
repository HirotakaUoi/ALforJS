<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>BSearch2 プレイグラウンド</title>
<link rel="stylesheet" href="common/playground.css">
</head>
<body>

<p class="note"><a href="index.html">&larr; 一覧に戻る</a></p>
<h1>BSearch2</h1>
<p class="note">
「実行」を押す（またはEnter）と開始。<code>input()</code>で止まったらターミナル内に入力欄が現れるので、
値を打ってEnterで続きが実行されます。</p>

<div class="panes">
  <section class="code-pane">
    <h2>ソースコード</h2>
    <p class="note" style="margin-bottom: 10px;">
      <code>print()</code> / <code>input()</code> は環境が提供する入出力（C++の cout / cin に相当）です。
      編集して「実行」を押すと、その内容で動きます。<br>
      このプログラムは入力があるので <code>function* main()</code> ＋ <code>yield* input(msg)</code> の形になっています
      （途中で止まって入力を待つため）。
    </p>
    <textarea id="source" spellcheck="false"></textarea>
  </section>
  <section class="terminal-pane">
    <h2>実行</h2>
    <div id="terminal" tabindex="0"></div>
    <div class="controls">
      <button id="runBtn">実行</button>
      <button id="resetBtn" class="secondary" disabled>リセット</button>
    </div>
  </section>
</div>

<script id="source-text" type="text/plain">
function bsearch(dst, first, last, s, step) {
    for (let k = 0; k < 2 * step; k++)
        print(" ");
    print("First= " + first + " Last= " + last + "\n");
    if (first > last) return -1;
    const center = Math.floor((first + last) / 2);
    for (let k = 0; k < 2 * step; k++) print(" ");
    print("Center= " + center + "\n");

    if (dst === s[center]) {
        return center;
    } else if (dst < s[center]) {
        return bsearch(dst, first, center - 1, s, step + 1);
    } else {
        return bsearch(dst, center + 1, last, s, step + 1);
    }
}

function* main() {
    const s = [0, 1, 2, 4, 5, 7, 8, 9];
    const N = 8;
    const d = parseInt(yield* input("Input search number: "), 10);

    const res = bsearch(d, 0, N - 1, s, 0);
    if (res === -1) {
        print("I can't find: " + d + "\n");
    } else {
        print("Found: " + d + " at index " + res + "\n");
    }
}
</script>
<script src="common/runner.js"></script>

</body>
</html>
