<h1>BubbleSort1（p5.js版）</h1>
<p class="note">
オレンジ＝比較中、赤＝いま交換した、緑＝完了。<br>
アルゴリズムは <code>Javascript/BubbleSort1.js</code> とまったく同じで、比較・交換の場所に記録用の1行を足しただけです。
</p>

<div id="canvas"></div>

<div class="controls">
<button id="btnRun">実行</button>
<button id="btnPlay">再生</button>
<button id="btnStep">1ステップ</button>
<button id="btnHead">最初から</button>
　速さ <input id="speed" type="range" min="1" max="200" value="12"> <span class="note">（1秒あたりの手数）</span>
</div>

<p class="note">下は元のプログラムの出力（cout 相当）です。アニメーションと同じ速さで出ます。</p>
<pre id="output"></pre>
