# Web/ の中身を GitHub Pages に公開する。
# ビルドは不要（静的ファイルをそのまま置くだけ）なので、アップロードして配信するだけ。
name: Deploy Web to Pages

on:
  push:
    branches: [main]
    paths:
      - 'Web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:          # 手動でも流せるようにしておく

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らないようにする。進行中のものは終わらせてから最新を出す
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Web            # Web/ の中身がサイトの根になる
      - id: deployment
        uses: actions/deploy-pages@v4
